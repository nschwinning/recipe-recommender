[project]
name = "recipe-recommender"
version = "0.1.0"
description = "AI recipe recommender backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openai-agents>=0.13.6",
    "openai>=2.31.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["recipe_recommender"]
strict = true

[[tool.mypy.overrides]]
module = ["agents", "agents.*"]
ignore_missing_imports = true
